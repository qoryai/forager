# A declaration's hosts are exact DNS names; a wildcard covers hosts nobody listed.
version: 1
runtime: claude
runtime_version: "2.1.273"
sources:
  output:
    format: jsonl
secrets:
  declares:
    - id: api_key
      title: Example API key
      name: EXAMPLE_API_KEY
      hosts: ["*.example.com"]
      auth: {scheme: bearer}
rules:
  - source: output
    match: {type: result}
    type: dev.qory.session.result
    data:
      session_id: session_id
