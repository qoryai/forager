# A model section with each kind of place: the model id in a setting, the run's effort
# in a variable, an agent's effort in the agent file's frontmatter, two formats, a key
# for each, one of them in two auths, and two variables in overrides.
version: 1
runtime: amp
runtime_version: "1"
sources: {output: {format: jsonl}}
rules: [{source: output, match: {type: end}, type: dev.qory.session.ended, data: {reason: why}}]
model:
  formats: [openai-responses, openai-chat]
  model: {setting: agent.model}
  effort:
    run: {variable: AMP_EFFORT, values: [low, medium, high]}
    agent: {frontmatter: reasoning-effort, values: [low, high]}
  endpoint: {variable: AMP_BASE_URL}
  keys:
    - {format: openai-responses, auth: {scheme: bearer}, variable: AMP_API_KEY}
    - {format: openai-responses, auth: {scheme: bearer, oauth: true}, variable: AMP_OAUTH_TOKEN}
    - {format: openai-chat, auth: {scheme: header, header: api-key}, variable: AMP_API_KEY}
  overrides: [AMP_MODEL, AMP_EFFORT_LEVEL]
