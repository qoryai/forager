# Reach a tool of the machine's, which serves a name that exists nowhere, on one prefix
# of its paths. The tool is started for the run with the argument; the proxy sends it
# every request to its host that the path rule allows.
version: 1
egress:
  mode: enforce
  allow:
    - api.anthropic.com
    - files.tools.internal
  paths:
    files.tools.internal:
      - /media/acme/shop/*
tools:
  - name: files
    argument: acme/shop
