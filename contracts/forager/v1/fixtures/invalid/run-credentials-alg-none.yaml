# alg none: a run credential with no signature.
- issuer: https://issuer.example
  audience: qory-gateway
  algorithms: [none]
  keys:
    - {alg: none, public_key_file: /etc/qory/issuer-k1.pem}
  labels:
    forge: {value: example-forge}
    repository: {claims: [namespace, project], join: "/"}
    run_key: {claim: sub}
