# The endpoint is one place: a variable or a setting, not both.
version: 1
runtime: amp
runtime_version: "1"
sources: {output: {format: jsonl}}
rules: [{source: output, match: {type: end}, type: dev.qory.runtime.ended, data: {reason: why}}]
model:
  formats: [anthropic-messages]
  model: {flag: --model}
  endpoint: {variable: AMP_BASE_URL, setting: apiBaseUrl}
