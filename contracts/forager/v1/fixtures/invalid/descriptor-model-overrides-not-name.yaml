# Each override of a model section is a variable's name.
version: 1
runtime: amp
runtime_version: "1"
sources: {output: {format: jsonl}}
rules: [{source: output, match: {type: end}, type: dev.qory.session.ended, data: {reason: why}}]
model:
  formats: [anthropic-messages]
  model: {flag: --model}
  endpoint: {variable: AMP_BASE_URL}
  overrides: [AMP-MODEL]
