# Egress hosts are exact DNS names; a wildcard covers hosts nobody listed.
version: 1
runtime: claude
runtime_version: "2.1.273"
sources:
  output:
    format: jsonl
egress_hosts: ["*.example.com"]
rules:
  - source: output
    match: {type: result}
    type: dev.qory.runtime.result
    data:
      session_id: session_id
