# The endpoint is a variable or a setting; a flag is not accepted there.
version: 1
runtime: amp
runtime_version: "1"
sources: {output: {format: jsonl}}
rules: [{source: output, match: {type: end}, type: dev.qory.runtime.ended, data: {reason: why}}]
model:
  formats: [anthropic-messages]
  model: {flag: --model}
  endpoint: {flag: --base-url}
