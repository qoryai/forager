# tools has summary.
version: 1
runtime: example
sources:
  output: {format: jsonl}
tools: {}
rules:
  - source: output
    match: {type: assistant, each.type: text}
    each: message.content
    type: dev.qory.runtime.text
    data:
      session_id: session_id
      text: each.text
      kind: each.type
