# A tools.summary path is a dotted path, no expression.
version: 1
runtime: example
runtime_version: "1.0.0"
sources:
  output: {format: jsonl}
tools:
  summary:
    Bash: "command | head"
rules:
  - source: output
    match: {type: assistant, each.type: text}
    each: message.content
    type: dev.qory.runtime.text
    data:
      session_id: session_id
      text: each.text
      kind: each.type
