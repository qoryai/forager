# Egress hosts are exact DNS names; an IP literal is none.
version: 1
runtime: claude
runtime_version: "2.1.273"
sources:
  output:
    format: jsonl
egress_hosts: [192.0.2.10]
rules:
  - source: output
    match: {type: result}
    type: dev.qory.runtime.result
    data:
      session_id: session_id
