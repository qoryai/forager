# A rule may not map line: the session sets it.
version: 1
runtime: example
sources:
  output: {format: jsonl}
rules:
  - source: output
    match: {type: assistant, each.type: text}
    each: message.content
    type: dev.qory.runtime.text
    data:
      session_id: session_id
      text: each.text
      kind: each.type
      line: line_number
