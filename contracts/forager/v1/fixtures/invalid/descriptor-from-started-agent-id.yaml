# from_started lists session_id alone.
version: 1
runtime: example
runtime_version: "1.0.0"
sources:
  output: {format: jsonl}
rules:
  - source: output
    match: {type: start}
    type: dev.qory.runtime.started
    data: {session_id: id}
    set: {source: startup}
  - source: output
    match: {type: done}
    type: dev.qory.runtime.turn_finished
    from_started: [session_id, agent_id]
