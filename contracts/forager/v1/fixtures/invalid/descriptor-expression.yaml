# A rule matches and copies; an expression is a runner change, not a descriptor.
version: 1
runtime: claude
runtime_version: "2.1.273"
sources:
  hooks:
    install: claude-settings
    events: [PreToolUse]
rules:
  - source: hooks
    match: {hook_event_name: {regex: "Pre.*"}}
    type: dev.qory.session.tool_started
    data:
      session_id: session_id
      tool: "upper(tool_name)"
