# A rule matches and copies; an expression is a Forager change, not a descriptor.
version: 1
runtime: claude
sources:
  hooks:
    install: claude-settings
    events: [PreToolUse]
rules:
  - source: hooks
    match: {hook_event_name: {regex: "Pre.*"}}
    type: dev.qory.runtime.tool_started
    data:
      session_id: session_id
      tool: "upper(tool_name)"
