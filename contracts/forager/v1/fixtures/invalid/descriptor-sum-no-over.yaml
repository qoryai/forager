# A sum needs over: the object whose members it adds.
version: 1
runtime: example
sources:
  output: {format: jsonl}
rules:
  - source: output
    match: {type: result}
    type: dev.qory.runtime.result
    data:
      session_id: session_id
      outcome: subtype
      is_error: is_error
    sum:
      fields: {usage.output: outputTokens}
