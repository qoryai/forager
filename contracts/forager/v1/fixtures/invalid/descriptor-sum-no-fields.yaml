# A sum needs at least one field.
version: 1
runtime: example
sources:
  output: {format: jsonl}
rules:
  - source: output
    match: {type: result}
    type: dev.qory.runtime.result
    data:
      session_id: session_id
      outcome: subtype
      is_error: is_error
    sum:
      over: modelUsage
      fields: {}
