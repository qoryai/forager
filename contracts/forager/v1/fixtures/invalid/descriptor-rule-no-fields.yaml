# A rule gives its event at least one field, in data, set or from_started.
version: 1
runtime: example
runtime_version: "1.0.0"
sources:
  output: {format: jsonl}
rules:
  - source: output
    match: {type: start}
    type: dev.qory.runtime.started
    data: {session_id: id}
    set: {source: startup}
  - source: output
    match: {type: done}
    type: dev.qory.runtime.turn_finished
