# The header scheme sets the header in the header member, so it needs one.
version: 1
runtime: claude
runtime_version: "2.1.273"
sources:
  output:
    format: jsonl
secrets:
  declares:
    - id: api_key
      title: Example API key
      name: EXAMPLE_API_KEY
      hosts: [api.example.com]
      auth: {scheme: header}
rules:
  - source: output
    match: {type: result}
    type: dev.qory.session.result
    data:
      session_id: session_id
