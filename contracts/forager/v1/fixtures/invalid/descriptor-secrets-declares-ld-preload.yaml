# A declared secret read from LD_PRELOAD.
version: 1
runtime: amp
runtime_version: "1"
sources: {output: {format: jsonl}}
rules: [{source: output, match: {type: end}, type: dev.qory.session.ended, data: {reason: why}}]
secrets:
  declares:
    - {id: token, title: A token, name: LD_PRELOAD, hosts: [api.example.com], auth: {scheme: bearer}}
