# HS256: an HMAC algorithm, which no public key checks.
- issuer: https://issuer.example
  audience: qory-gateway
  algorithms: [HS256]
  keys:
    - {alg: HS256, public_key_file: /etc/qory/issuer-k1.pem}
  labels:
    forge: {value: example-forge}
    repository: {claims: [namespace, project], join: "/"}
    run_key: {claim: sub}
