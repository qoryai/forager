# A descriptor's resume prefix lies under the runtime's home, ~/.
version: 1
runtime: claude
runtime_version: "2.1.316"
sources:
  output:
    format: jsonl
resume:
  path_from: transcript_path
  path: ~/.claude/projects/{cwd_slug}/{session_id}.jsonl
  prefix: /tmp/projects/
  args: ["--resume", "{session_id}"]
rules:
  - source: output
    match: {type: result}
    type: dev.qory.runtime.result
    data:
      session_id: session_id
