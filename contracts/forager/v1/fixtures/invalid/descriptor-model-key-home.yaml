# A key read from HOME.
version: 1
runtime: amp
runtime_version: "1"
sources: {output: {format: jsonl}}
rules: [{source: output, match: {type: end}, type: dev.qory.session.ended, data: {reason: why}}]
model:
  formats: [openai-chat]
  model: {flag: --model}
  endpoint: {variable: AMP_BASE_URL}
  keys: [{format: openai-chat, auth: {scheme: bearer}, variable: HOME}]
