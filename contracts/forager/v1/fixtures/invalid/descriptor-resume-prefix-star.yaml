# The prefix is a directory without *.
version: 1
runtime: amp
runtime_version: "1"
sources: {output: {format: jsonl}}
rules: [{source: output, match: {type: end}, type: dev.qory.runtime.ended, data: {reason: why}}]
resume:
  path: ~/.amp/*/{session_id}.jsonl
  prefix: ~/.amp/*/
  args: [--resume, "{session_id}"]
