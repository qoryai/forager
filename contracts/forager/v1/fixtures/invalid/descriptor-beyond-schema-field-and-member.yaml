# A rule sets no member of a field it sets: usage and usage.output. Only the session's
# reader checks it.
version: 1
runtime: example
sources:
  output: {format: jsonl}
rules:
  - source: output
    match: {type: result}
    type: dev.qory.runtime.result
    data:
      session_id: session_id
      outcome: subtype
      is_error: is_error
      usage: usage
    sum:
      over: modelUsage
      fields: {usage.output: outputTokens}
