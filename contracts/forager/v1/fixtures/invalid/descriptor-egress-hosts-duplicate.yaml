# Egress hosts list each host once.
version: 1
runtime: claude
runtime_version: "2.1.273"
sources:
  output:
    format: jsonl
egress_hosts: [api.example.com, api.example.com]
rules:
  - source: output
    match: {type: result}
    type: dev.qory.runtime.result
    data:
      session_id: session_id
