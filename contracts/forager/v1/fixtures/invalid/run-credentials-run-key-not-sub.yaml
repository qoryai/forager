# run_key from another claim than sub: the run key is always sub.
- issuer: https://issuer.example
  audience: qory-gateway
  algorithms: [RS256]
  keys:
    - {alg: RS256, public_key_file: /etc/qory/issuer-k1.pem}
  labels:
    forge: {value: example-forge}
    repository: {claims: [namespace, project], join: "/"}
    run_key: {claim: run}
