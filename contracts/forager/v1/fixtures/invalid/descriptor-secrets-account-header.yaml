# Only an API credential of a run configuration has an account header.
version: 1
runtime: amp
runtime_version: "1"
sources: {output: {format: jsonl}}
rules: [{source: output, match: {type: end}, type: dev.qory.runtime.ended, data: {reason: why}}]
secrets:
  declares:
    - {id: key, title: Key, name: AMP_SECRET, hosts: [secret.example.com], auth: {scheme: bearer, oauth: true, account_header: x-account, account_claim: /account}}
