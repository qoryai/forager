# dev.qory.runtime.message is no type: dev.qory.runtime.text replaced it.
version: 1
runtime: example
runtime_version: "1.0.0"
sources:
  output: {format: jsonl}
rules:
  - source: output
    match: {type: assistant, each.type: text}
    each: message.content
    type: dev.qory.runtime.message
    data:
      session_id: session_id
      text: each.text
      kind: each.type
