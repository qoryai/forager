# Claude Code. Written against 2.1.273 and its published hooks reference and headless
# output; the fixtures beside this file are what the rules were checked on.
#
# The hooks report the session in both modes, interactive and not, so they are the
# canonical source. The standard output, JSON lines when the session runs on pipes, adds
# only the result line, which no hook reports: the outcome, the turns and the cost.
# Its init line is not mapped, because SessionStart already produced session.started.
#
# Work in the background has no hook of its own. Its start is a tool call like any other,
# with run_in_background in the input and whatever the tool returned in the response, and
# a subagent's start and end are the subagent hooks. After that the runtime reports the list of
# what is still running, in the Stop and SubagentStop inputs, copied as background_tasks:
# a task gone from the list has ended. The runtime reports no exit status and no duration
# for it, so neither is here.
version: 1
runtime: claude
title: Claude Code
runtime_version: "2.1.273"
sources:
  output:
    format: jsonl
  hooks:
    install: claude-settings
    events:
      - SessionStart
      - UserPromptSubmit
      - PreToolUse
      - PostToolUse
      - PostToolUseFailure
      - SubagentStart
      - SubagentStop
      - Stop
      - StopFailure
      - Notification
      - SessionEnd
# The print flag is the headless mode: a session started with it runs on pipes, whoever
# started it, and the result line is read from its standard output.
headless:
  args: ["-p", "--print"]
# The model credential is an API key or an OAuth credential, one of the two. Claude Code
# reads ANTHROPIC_AUTH_TOKEN before either, so it is reserved. The denied variables move
# where requests and the credential go, add headers, switch to another provider, wrap or
# replace the shell, move the settings and the credential file, or change the client
# certificate and the trust of TLS connections; each is in the environment-variable
# reference and in the 2.1.288 binary.
secrets:
  declares:
    - id: api_key
      title: Anthropic API key
      name: ANTHROPIC_API_KEY
      hosts: [api.anthropic.com]
      paths: [/v1/*]
      auth: {scheme: header, header: x-api-key}
    - id: oauth_token
      title: Claude OAuth credential
      name: CLAUDE_CODE_OAUTH_TOKEN
      hosts: [api.anthropic.com]
      paths: [/v1/*]
      auth: {scheme: bearer}
  one_of:
    - id: model_key
      required: true
      of: [api_key, oauth_token]
  reserves: [ANTHROPIC_AUTH_TOKEN]
  credential_files: [~/.claude/.credentials.json]
  denies: [ANTHROPIC_BASE_URL, ANTHROPIC_BEDROCK_BASE_URL, ANTHROPIC_BEDROCK_MANTLE_BASE_URL,
           ANTHROPIC_VERTEX_BASE_URL, ANTHROPIC_FOUNDRY_BASE_URL, ANTHROPIC_AWS_BASE_URL,
           ANTHROPIC_CUSTOM_HEADERS, CLAUDE_CODE_USE_BEDROCK, CLAUDE_CODE_USE_VERTEX,
           CLAUDE_CODE_USE_FOUNDRY, CLAUDE_CODE_USE_ANTHROPIC_AWS, CLAUDE_CODE_SHELL,
           CLAUDE_CODE_SHELL_PREFIX, CLAUDE_ENV_FILE, CLAUDE_CONFIG_DIR,
           CLAUDE_CODE_CLIENT_CERT, CLAUDE_CODE_CLIENT_KEY, CLAUDE_CODE_CERT_STORE]
rules:
  - source: hooks
    match: {hook_event_name: SessionStart}
    type: dev.qory.session.started
    data:
      session_id: session_id
      source: source
      model: model
      cwd: cwd
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: UserPromptSubmit}
    type: dev.qory.session.prompt_submitted
    data:
      session_id: session_id
      prompt: prompt
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: PreToolUse}
    type: dev.qory.session.tool_started
    data:
      session_id: session_id
      tool: tool_name
      tool_use_id: tool_use_id
      input: tool_input
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: PostToolUse}
    type: dev.qory.session.tool_finished
    data:
      session_id: session_id
      tool: tool_name
      tool_use_id: tool_use_id
      input: tool_input
      response: tool_response
      duration_ms: duration_ms
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: PostToolUseFailure}
    type: dev.qory.session.tool_failed
    data:
      session_id: session_id
      tool: tool_name
      tool_use_id: tool_use_id
      input: tool_input
      error: error
      interrupted: is_interrupt
      duration_ms: duration_ms
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: SubagentStart}
    type: dev.qory.session.subagent_started
    data:
      session_id: session_id
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: SubagentStop}
    type: dev.qory.session.subagent_finished
    data:
      session_id: session_id
      agent_id: agent_id
      agent_type: agent_type
      message: last_assistant_message
      background_tasks: background_tasks
  - source: hooks
    match: {hook_event_name: Stop}
    type: dev.qory.session.turn_finished
    data:
      session_id: session_id
      message: last_assistant_message
      background_tasks: background_tasks
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: StopFailure}
    type: dev.qory.session.turn_failed
    data:
      session_id: session_id
      error: error
      details: error_details
      message: last_assistant_message
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: Notification}
    type: dev.qory.session.notification
    data:
      session_id: session_id
      kind: notification_type
      message: message
      title: title
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: SessionEnd}
    type: dev.qory.session.ended
    data:
      session_id: session_id
      reason: reason
      agent_id: agent_id
      agent_type: agent_type
  - source: output
    match: {type: result}
    type: dev.qory.session.result
    data:
      session_id: session_id
      outcome: subtype
      is_error: is_error
      turns: num_turns
      duration_ms: duration_ms
      cost_usd: total_cost_usd
      result: result
