# Claude Code. Written against 2.1.273 and its published hooks reference and headless
# output; the fixtures beside this file are what the rules were checked on.
#
# The hooks report the session in both modes, interactive and not, so they are the
# canonical source. The standard output, JSON lines when the session runs on pipes, adds
# only the result line, which no hook reports: the outcome, the turns and the cost.
# Its init line is not mapped, because SessionStart already produced runtime.started.
#
# Work in the background has no separate hook. Its start is a tool call like any other,
# with run_in_background in the input and whatever the tool returned in the response, and
# a subagent's start and end are the subagent hooks. After that the runtime reports the list of
# what is still running, in the Stop and SubagentStop inputs, copied as background_tasks:
# a task gone from the list has ended. The runtime reports no exit status and no duration
# for it, so neither is here.
version: 1
runtime: claude
title: Claude Code
runtime_version: "2.1.273"
sources:
  output:
    format: jsonl
  hooks:
    install: claude-settings
    events:
      - SessionStart
      - UserPromptSubmit
      - PreToolUse
      - PostToolUse
      - PostToolUseFailure
      - SubagentStart
      - SubagentStop
      - Stop
      - StopFailure
      - Notification
      - SessionEnd
# The print flag is the headless mode: a session started with it runs on pipes, whoever
# started it, and the result line is read from its standard output.
headless:
  args: ["-p", "--print"]
# Claude Code reads its model key from the variables of model.keys, below. The denied
# variables move where requests and the credential go, add headers, switch to another
# provider, wrap or replace the shell, move the settings and the credential file, or
# change the client certificate and the trust of TLS connections; each is in the
# environment-variable reference and in the 2.1.288 binary.
secrets:
  credential_files: [~/.claude/.credentials.json]
  denies: [ANTHROPIC_BASE_URL, ANTHROPIC_BEDROCK_BASE_URL, ANTHROPIC_BEDROCK_MANTLE_BASE_URL,
           ANTHROPIC_VERTEX_BASE_URL, ANTHROPIC_FOUNDRY_BASE_URL, ANTHROPIC_AWS_BASE_URL,
           ANTHROPIC_CUSTOM_HEADERS, CLAUDE_CODE_USE_BEDROCK, CLAUDE_CODE_USE_VERTEX,
           CLAUDE_CODE_USE_FOUNDRY, CLAUDE_CODE_USE_ANTHROPIC_AWS, CLAUDE_CODE_SHELL,
           CLAUDE_CODE_SHELL_PREFIX, CLAUDE_ENV_FILE, CLAUDE_CONFIG_DIR,
           CLAUDE_CODE_CLIENT_CERT, CLAUDE_CODE_CLIENT_KEY, CLAUDE_CODE_CERT_STORE,
           CLAUDE_CODE_PLUGIN_DIRS, CLAUDE_RELAUNCH_SESSION_ADD_DIRS,
           CLAUDE_CODE_PLUGIN_SEED_DIR, CLAUDE_CODE_PLUGIN_CACHE_DIR,
           CLAUDE_CODE_MANAGED_SETTINGS_PATH]
# Claude Code sends Anthropic's Messages format. A composer writes the run's model id as
# --model and its effort value as --effort, an agent's effort value in the agent file's
# effort frontmatter, and the base URL in ANTHROPIC_BASE_URL. Claude Code reads an API
# key from ANTHROPIC_API_KEY, which it sends as x-api-key, or from ANTHROPIC_AUTH_TOKEN,
# which it sends as a bearer and reads before the others, and a subscription login's key
# from CLAUDE_CODE_OAUTH_TOKEN, as a bearer. The session gives an API credential's
# placeholder to the key of its format and auth, and sets ANTHROPIC_BASE_URL to the
# credential's endpoint in place of every other value. denies lists ANTHROPIC_BASE_URL.
# Without an API credential, behind a wall the session keeps a value of it only when its
# host is a host of a run's credential whose placeholder this descriptor declares; it
# declares none, so it leaves every value out in place of denies, and it does not check
# the value the run inherits. Without a wall denies applies to it as to any other name. overrides lists the variables Claude Code reads a model
# id, an effort value or an extra request body from, beside what a composer writes.
# Behind a wall the session leaves out the server's, the run's, the machine's and the
# harness's values of them, the harness's computed values included, and unsets inside
# each one that nothing else sets; without a wall they reach Claude Code as before.
model:
  formats: [anthropic-messages]
  model: {flag: --model}
  effort:
    run: {flag: --effort, values: [low, medium, high, xhigh, max]}
    agent: {frontmatter: effort, values: [low, medium, high, xhigh, max]}
  endpoint: {variable: ANTHROPIC_BASE_URL}
  keys:
    - {format: anthropic-messages, auth: {scheme: header, header: x-api-key}, variable: ANTHROPIC_API_KEY}
    - {format: anthropic-messages, auth: {scheme: bearer}, variable: ANTHROPIC_AUTH_TOKEN}
    - {format: anthropic-messages, auth: {scheme: bearer, oauth: true}, variable: CLAUDE_CODE_OAUTH_TOKEN}
  overrides: [ANTHROPIC_MODEL, ANTHROPIC_DEFAULT_MODEL, ANTHROPIC_DEFAULT_OPUS_MODEL,
              ANTHROPIC_DEFAULT_SONNET_MODEL, ANTHROPIC_DEFAULT_HAIKU_MODEL,
              ANTHROPIC_DEFAULT_FABLE_MODEL, ANTHROPIC_SMALL_FAST_MODEL,
              CLAUDE_CODE_SUBAGENT_MODEL, CLAUDE_CODE_SUBAGENT_MODEL_FORCE,
              CLAUDE_CODE_AUTO_MODE_MODEL, CLAUDE_CODE_EFFORT_LEVEL, CLAUDE_CODE_EXTRA_BODY]
rules:
  - source: hooks
    match: {hook_event_name: SessionStart}
    type: dev.qory.runtime.started
    data:
      session_id: session_id
      source: source
      model: model
      cwd: cwd
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: UserPromptSubmit}
    type: dev.qory.runtime.prompt_submitted
    data:
      session_id: session_id
      prompt: prompt
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: PreToolUse}
    type: dev.qory.runtime.tool_started
    data:
      session_id: session_id
      tool: tool_name
      tool_use_id: tool_use_id
      input: tool_input
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: PostToolUse}
    type: dev.qory.runtime.tool_finished
    data:
      session_id: session_id
      tool: tool_name
      tool_use_id: tool_use_id
      input: tool_input
      response: tool_response
      duration_ms: duration_ms
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: PostToolUseFailure}
    type: dev.qory.runtime.tool_failed
    data:
      session_id: session_id
      tool: tool_name
      tool_use_id: tool_use_id
      input: tool_input
      error: error
      interrupted: is_interrupt
      duration_ms: duration_ms
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: SubagentStart}
    type: dev.qory.runtime.subagent_started
    data:
      session_id: session_id
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: SubagentStop}
    type: dev.qory.runtime.subagent_finished
    data:
      session_id: session_id
      agent_id: agent_id
      agent_type: agent_type
      message: last_assistant_message
      background_tasks: background_tasks
  - source: hooks
    match: {hook_event_name: Stop}
    type: dev.qory.runtime.turn_finished
    data:
      session_id: session_id
      message: last_assistant_message
      background_tasks: background_tasks
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: StopFailure}
    type: dev.qory.runtime.turn_failed
    data:
      session_id: session_id
      error: error
      details: error_details
      message: last_assistant_message
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: Notification}
    type: dev.qory.runtime.notification
    data:
      session_id: session_id
      kind: notification_type
      message: message
      title: title
      agent_id: agent_id
      agent_type: agent_type
  - source: hooks
    match: {hook_event_name: SessionEnd}
    type: dev.qory.runtime.ended
    data:
      session_id: session_id
      reason: reason
      agent_id: agent_id
      agent_type: agent_type
  - source: output
    match: {type: result}
    type: dev.qory.runtime.result
    data:
      session_id: session_id
      outcome: subtype
      is_error: is_error
      turns: num_turns
      duration_ms: duration_ms
      cost_usd: total_cost_usd
      result: result
