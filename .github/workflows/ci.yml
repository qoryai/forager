name: CI

on:
  push:
    branches: [main, next]
  pull_request:

# A pull request's runs of one ref cancel each other; a push to main or next has a group of
# its own, so none is cancelled or left waiting.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  part:
    # One job for each part of the module: the core (the packages at the root and under
    # internal/), the gateway, the wall, the session, and e2e's static checks. Without
    # Docker, e2e's suite skips here; the two conformance jobs below run it.
    name: Go tests, ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [core, gateway, wall, session, e2e]
    runs-on: ubuntu-latest
    container:
      image: docker.io/golang:1.27
    steps:
      - name: Install node for the JavaScript actions
        # checkout@v7 runs on node 24; the image has none.
        env:
          NODE_VERSION: 24.20.0
        run: |
          case "$(uname -m)" in aarch64) arch=arm64 ;; x86_64) arch=x64 ;; *) echo "unsupported arch" >&2; exit 1 ;; esac
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${arch}.tar.gz" \
            | tar -xz -C /usr/local --strip-components=1
          node --version

      - uses: actions/checkout@v7

      - name: Trust the checkout
        # The checkout belongs to the runner user, the container runs as root, and git
        # refuses to read a repository it sees as someone else's.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the module cache
        uses: actions/cache@v6
        with:
          path: /go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Find the build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        # Each run saves its own and restores the latest of its part.
        uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: ${{ runner.os }}-go-part-${{ matrix.part }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-part-${{ matrix.part }}-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-part-${{ matrix.part }}-

      - name: List the part's packages
        id: part
        env:
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = core ]; then
            module=$(go list -m)
            pkgs=$(go list ./... | grep -vE "^$module/(gateway|wall|session|e2e)(/|\$)")
          else
            pkgs=$(go list "./$PART/...")
          fi
          dirs=$(go list -f '{{.Dir}}' $pkgs | sed "s#^$PWD#.#" | tr '\n' ' ')
          echo "$dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        env:
          DIRS: ${{ steps.part.outputs.dirs }}
        run: test -z "$(gofmt -l $DIRS)"

      - name: Vet
        env:
          DIRS: ${{ steps.part.outputs.dirs }}
        run: go vet $DIRS

      - name: Test
        # In the core, every fixture under contracts/forager/v1 is validated against its
        # schema, and the import rules between the parts are checked. The test cache sees
        # neither what the import rules read through go list nor whether e2e reaches a
        # Docker, so the core and e2e test every time.
        env:
          DIRS: ${{ steps.part.outputs.dirs }}
          COUNT: ${{ (matrix.part == 'core' || matrix.part == 'e2e') && '-count=1' || '' }}
        run: go test $COUNT $DIRS

      - name: Build
        env:
          DIRS: ${{ steps.part.outputs.dirs }}
        run: go build $DIRS

      - name: Check doc comments
        env:
          DIRS: ${{ steps.part.outputs.dirs }}
        run: go run github.com/mgechev/revive@v1.16.0 -config revive.toml -set_exit_status $DIRS

  test:
    # The one check that stands for every part's job above.
    name: Go tests
    needs: part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.part.result }}
        run: test "$RESULT" = success

  e2e:
    name: Wall conformance
    # On the machine itself, not in a container: the suite needs the docker command and
    # an engine it reaches, and a Linux host is where the hook socket crosses a mount, so
    # this is where an adapter is proven.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Its cache keys on go.sum and the Go version, not the sources, and saves only on
          # a new key; the next steps cache instead.
          cache: false

      - name: Find the caches
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the build and module caches
        # Each run saves its own and restores the latest of this job.
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: ${{ runner.os }}-go-conformance-docker-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-conformance-docker-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-conformance-docker-

      - name: Run the suite against Docker
        # The test binary is the relay, the forwarder and the probe inside the enclosure,
        # so it is built static. QORY_WALL_REQUIRE turns a skip into a failure: this job
        # cannot pass by proving nothing. The suite with a Docker inside is the next job's.
        env:
          CGO_ENABLED: "0"
          QORY_WALL_REQUIRE: "1"
        run: go test ./e2e -count=1 -v -run '^TestDockerConforms$'

  e2e-docker:
    name: Wall conformance, a Docker of the agent's own
    # The same suite in an enclosure that starts a daemon of its own, under Sysbox, whose
    # container root is a user of the machine's that is not root. Sysbox is installed on
    # the machine, as a node's owner installs it.
    runs-on: ubuntu-latest
    env:
      SYSBOX_VERSION: 0.7.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Its cache keys on go.sum and the Go version, not the sources, and saves only on
          # a new key; the next steps cache instead.
          cache: false

      - name: Find the caches
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the build and module caches
        # Each run saves its own and restores the latest of this job.
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: ${{ runner.os }}-go-conformance-sysbox-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-conformance-sysbox-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-conformance-sysbox-

      - name: Install Sysbox
        # Its package restarts the engine and needs no container running.
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -fsSLo sysbox.deb "https://github.com/nestybox/sysbox/releases/download/v${SYSBOX_VERSION}/sysbox-ce_${SYSBOX_VERSION}.linux_amd64.deb"
          docker rm -f $(docker ps -aq) 2>/dev/null || true
          sudo apt-get install -y ./sysbox.deb
          docker info --format '{{json .Runtimes}}' | grep -q sysbox-runc
          # The package returns before sysbox-fs and sysbox-mgr listen, and a container
          # started before then fails. Wait up to 60 seconds for each socket. /run/sysbox
          # is open to root alone, so the check runs as root.
          for sock in /run/sysbox/sysfs.sock /run/sysbox/sysmgr.sock; do
            for _ in $(seq 60); do
              sudo test -S "$sock" && continue 2
              sleep 1
            done
            systemctl status sysbox sysbox-fs sysbox-mgr --no-pager || true
            echo "::error::Sysbox socket $sock is missing after 60 seconds"
            exit 1
          done

      - name: Run the suite against Docker, with a Docker inside
        # QORY_WALL_REQUIRE turns a skip into a failure, as in the wall job.
        env:
          CGO_ENABLED: "0"
          QORY_WALL_REQUIRE: "1"
          QORY_WALL_RUNTIME: sysbox-runc
        run: go test ./e2e -count=1 -v -run TestDockerNestedConforms
